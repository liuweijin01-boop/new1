<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>射击打靶</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
  /* 布局：WebGL 全屏第一人称视图，HUD 按 CS 习惯分布在四角，菜单面板居中 */
  :root {
    --bg: #1a1c16; --panel: rgba(18, 20, 15, 0.9); --fg: #f3eee2; --muted: #b8b2a2;
    --hud: #f2d48a; --danger: #ff5a45; --ct: #7fb2ff; --t: #e8b04a; --line: rgba(242, 212, 138, 0.25);
    --num: "Chakra Petch", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--body); user-select: none; -webkit-user-select: none; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; cursor: none; touch-action: none; }

  #hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--num); text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #radar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; width: 150px; height: 150px; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,.35); }
  #topbar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 14px; padding: 6px 14px; background: rgba(0,0,0,.45); border-radius: 6px; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #topbar b { color: var(--hud); }
  #feed { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 14px; }
  .kf { background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 4px; border: 1px solid transparent; }
  .kf.mine { border-color: var(--danger); }
  .kf .ct { color: var(--ct); } .kf .t { color: var(--t); } .kf .w { color: var(--muted); margin: 0 6px; }

  #cross { position: absolute; left: 50%; top: 50%; --gap: 6px; }
  #cross i { position: absolute; background: #5cff6a; box-shadow: 0 0 2px #000; }
  #cross .t, #cross .b { width: 2px; height: 9px; left: -1px; }
  #cross .l, #cross .r { height: 2px; width: 9px; top: -1px; }
  #cross .t { bottom: var(--gap); } #cross .b { top: var(--gap); }
  #cross .l { right: var(--gap); } #cross .r { left: var(--gap); }
  #hitmark { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; opacity: 0; }
  #hitmark::before, #hitmark::after { content: ""; position: absolute; left: 12px; top: 0; width: 2px; height: 26px; background: var(--fg); transform: rotate(45deg); }
  #hitmark::after { transform: rotate(-45deg); }
  #hitmark.head::before, #hitmark.head::after { background: var(--danger); }
  #dmgdir { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px; border-radius: 50%; border-top: 6px solid var(--danger); opacity: 0; }
  #vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(200, 0, 0, .9); opacity: 0; }
  #banner { position: absolute; left: 0; right: 0; top: 28%; text-align: center; font-size: 34px; font-weight: 700; color: var(--hud); letter-spacing: .06em; opacity: 0; transition: opacity .3s; }
  #banner small { display: block; font-size: 16px; color: var(--fg); font-weight: 500; margin-top: 6px; letter-spacing: 0; }

  #status { position: absolute; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 22px; padding: 8px 16px; background: rgba(0,0,0,.45); border-radius: 6px; }
  #status div, #ammoBox { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  #status .ico { color: var(--hud); font-size: 20px; }
  #status b, #ammoBox b { font-size: 32px; color: var(--hud); }
  #status b.low { color: var(--danger); }
  #ammoBox { position: absolute; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 8px 16px; background: rgba(0,0,0,.45); border-radius: 6px; font-size: 20px; color: var(--muted); }
  #ammoBox small { font-size: 13px; margin-left: 6px; letter-spacing: .08em; }
  #reloadTxt { position: absolute; left: 50%; top: calc(50% + 40px); transform: translateX(-50%); font-size: 15px; color: var(--hud); }

  #touch { position: fixed; inset: 0; pointer-events: none; }
  #touch button { pointer-events: auto; position: absolute; border-radius: 50%; border: 2px solid var(--line); background: rgba(0,0,0,.35); color: var(--fg); font: 600 15px var(--body); touch-action: none; }
  #tFire { right: 28px; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; background: rgba(255,90,69,.35); }
  #tReload { right: 124px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; }
  #tJump { right: 40px; bottom: calc(210px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; }
  #tCrouch { right: 124px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; }
  #stick { position: absolute; width: 110px; height: 110px; margin: -55px; border-radius: 50%; border: 2px solid var(--line); background: rgba(0,0,0,.25); }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: rgba(242,212,138,.5); }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 11, 8, .55); }
  .panel { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; padding: 28px 28px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .panel h1 { margin: 0 0 4px; font: 700 40px/1.1 var(--num); color: var(--hud); letter-spacing: .04em; text-wrap: balance; }
  .panel .tag { margin: 0 0 16px; font: 500 13px var(--num); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .panel p { margin: 0 0 14px; color: var(--muted); line-height: 1.65; max-width: 60ch; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 18px; font-size: 14px; color: var(--fg); }
  kbd { font: 600 12px var(--num); padding: 2px 7px; border: 1px solid var(--line); border-radius: 4px; color: var(--hud); white-space: nowrap; justify-self: start; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 0 0 18px; }
  .stats div { padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
  .stats span { display: block; font-size: 12px; color: var(--muted); }
  .stats b { font: 700 24px var(--num); color: var(--hud); font-variant-numeric: tabular-nums; }
  .panel button { font: 700 18px var(--body); padding: 12px 28px; border: none; border-radius: 6px; background: var(--hud); color: #1a1c16; cursor: pointer; }
  .panel button:hover { filter: brightness(1.1); }
  .panel button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .best { margin-top: 14px; font-size: 13px; color: var(--muted); }
  @media (max-width: 560px) {
    #radar { width: 100px; height: 100px; }
    #topbar { font-size: 13px; gap: 8px; top: calc(118px + env(safe-area-inset-top, 0px)); left: 16px; transform: none; }
    #feed { font-size: 12px; }
    #status b, #ammoBox b { font-size: 24px; }
    .panel h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<div id="view"></div>
<div id="hud" hidden>
  <canvas id="radar" width="150" height="150"></canvas>
  <div id="topbar"><span>回合 <b id="roundLbl">1</b></span><span>剩余敌人 <b id="enemyLbl">0</b></span><span>得分 <b id="scoreLbl">0</b></span></div>
  <div id="feed"></div>
  <div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
  <div id="hitmark"></div>
  <div id="dmgdir"></div>
  <div id="vignette"></div>
  <div id="banner"></div>
  <div id="reloadTxt" hidden>换弹中…</div>
  <div id="status"><div><span class="ico">✚</span><b id="hp">100</b></div><div><span class="ico">⛨</span><b id="ar">100</b></div></div>
  <div id="ammoBox"><b id="mag">30</b><span>/ <span id="res">90</span></span><small>AK-47</small></div>
</div>
<div id="touch" hidden>
  <div id="stick" hidden><div id="knob"></div></div>
  <button id="tFire">开火</button><button id="tReload">换弹</button><button id="tJump">跳</button><button id="tCrouch">蹲</button>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const isTouch = matchMedia('(pointer: coarse)').matches;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

  // ================= 渲染器 / 场景 =================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.autoClear = false;
  $('view').appendChild(renderer.domElement);
  const canvasEl = renderer.domElement;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa9c4dc);
  scene.fog = new THREE.Fog(0xd8cdb2, 45, 120);
  const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 200);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  // 手中武器单独一个场景渲染，避免穿墙
  const vmScene = new THREE.Scene();
  const vmCamera = new THREE.PerspectiveCamera(60, 1, 0.01, 10);
  vmScene.add(new THREE.HemisphereLight(0xfff4e0, 0x6b5a40, 1.0));
  const vmSun = new THREE.DirectionalLight(0xffffff, 0.6); vmSun.position.set(1, 2, 1); vmScene.add(vmSun);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = vmCamera.aspect = w / h;
    camera.updateProjectionMatrix(); vmCamera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8a7550, 0.7));
  const sun = new THREE.DirectionalLight(0xfff0d0, 0.85);
  sun.position.set(30, 55, 18); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 160 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  const flashLight = new THREE.PointLight(0xffcc66, 0, 10); scene.add(flashLight);

  // ================= 程序生成贴图 =================
  function canvasTex(size, draw) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
    return t;
  }
  const sandTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#c9a46a'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 7000; i++) {
      const dark = Math.random() < 0.5;
      g.fillStyle = dark ? `rgba(90,60,30,${Math.random() * 0.14})` : `rgba(255,232,185,${Math.random() * 0.14})`;
      g.fillRect(Math.random() * s, Math.random() * s, 2, 2);
    }
  });
  const wallTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#9c8662'; g.fillRect(0, 0, s, s);
    const bh = 32;
    for (let y = 0; y < s; y += bh) {
      const off = (y / bh) % 2 ? 32 : 0;
      for (let x = -64; x < s; x += 64) {
        g.fillStyle = `hsl(38, ${32 + Math.random() * 12}%, ${64 + Math.random() * 9}%)`;
        g.fillRect(x + off + 2, y + 2, 60, bh - 4);
      }
    }
    for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(80,50,20,${Math.random() * 0.08})`; g.fillRect(Math.random() * s, Math.random() * s, 2, 2); }
  });
  const crateTex = canvasTex(128, (g, s) => {
    g.fillStyle = '#9a6b35'; g.fillRect(0, 0, s, s);
    g.strokeStyle = '#6b4520'; g.lineWidth = 2;
    for (let y = 0; y < s; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke(); }
    g.lineWidth = 12; g.strokeStyle = '#7a5228'; g.strokeRect(6, 6, s - 12, s - 12);
    g.beginPath(); g.moveTo(10, 10); g.lineTo(s - 10, s - 10); g.moveTo(s - 10, 10); g.lineTo(10, s - 10); g.stroke();
  });
  const holeTex = canvasTex(64, (g, s) => {
    const r = g.createRadialGradient(s / 2, s / 2, 2, s / 2, s / 2, s / 2);
    r.addColorStop(0, 'rgba(10,8,6,1)'); r.addColorStop(0.35, 'rgba(30,24,18,.9)'); r.addColorStop(1, 'rgba(30,24,18,0)');
    g.fillStyle = r; g.fillRect(0, 0, s, s);
  });
  const flashTex = canvasTex(128, (g, s) => {
    g.translate(s / 2, s / 2);
    for (let i = 0; i < 8; i++) {
      g.rotate(Math.PI / 4);
      g.fillStyle = 'rgba(255,200,90,.85)';
      g.beginPath(); g.moveTo(0, -6); g.lineTo(s * (i % 2 ? 0.3 : 0.48), 0); g.lineTo(0, 6); g.fill();
    }
    const r = g.createRadialGradient(0, 0, 0, 0, 0, s * 0.3);
    r.addColorStop(0, 'rgba(255,255,230,1)'); r.addColorStop(1, 'rgba(255,170,60,0)');
    g.fillStyle = r; g.beginPath(); g.arc(0, 0, s * 0.3, 0, Math.PI * 2); g.fill();
  });
  function siteTex(letter) {
    return canvasTex(256, (g, s) => {
      g.font = 'bold 200px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(200,60,30,.75)'; g.fillText(letter, s / 2, s / 2 + 10);
    });
  }

  // ================= 地图（沙城风格） =================
  const colliders = [], wallMeshes = [];
  const crateMat = new THREE.MeshLambertMaterial({ map: crateTex });
  function addBox(x, z, w, d, h, kind = 'wall', y0 = 0) {
    let mat = crateMat;
    if (kind !== 'crate') {
      const t = wallTex.clone(); t.needsUpdate = true; t.repeat.set(Math.max(w, d) / 4, h / 4);
      mat = new THREE.MeshLambertMaterial({ map: t, color: kind === 'dark' ? 0xc9b48c : 0xffffff });
    }
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y0 + h / 2, z); m.castShadow = m.receiveShadow = true;
    scene.add(m); wallMeshes.push(m);
    colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, top: y0 + h });
  }
  const crate = (x, z, s = 1.2, y0 = 0) => addBox(x, z, s, s, s, 'crate', y0);

  const HALF = 36;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, HALF * 2), new THREE.MeshLambertMaterial({ map: sandTex }));
  sandTex.repeat.set(18, 18);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  addBox(0, -HALF, HALF * 2 + 1, 1, 7); addBox(0, HALF, HALF * 2 + 1, 1, 7);
  addBox(-HALF, 0, 1, HALF * 2, 7); addBox(HALF, 0, 1, HALF * 2, 7);
  addBox(-21, -19, 12, 8, 7, 'dark');   // 西南民房
  addBox(24, 10, 10, 12, 8, 'dark');    // 东侧高楼
  addBox(-20, 22, 14, 6, 6);            // 西北长屋
  addBox(14, -22, 8, 10, 6);            // 东南仓库
  addBox(-22, 0, 28, 1, 4);             // 中路分隔墙（西）
  addBox(22, -1, 28, 1, 4);             // 中路分隔墙（东）
  addBox(0, 25, 1, 22, 4);              // 北侧隔墙
  addBox(0, -25, 1, 22, 4);             // 南侧隔墙
  addBox(-3, 6, 4, 0.8, 2.2);           // 中路矮墙
  addBox(4, -6, 0.8, 5, 2.2);
  crate(2.5, 2.5); crate(2.5, 2.5, 1.0, 1.2);
  crate(-6, -4); crate(-7.2, -4); crate(-6.6, -4, 1.0, 1.2);
  crate(12, 6); crate(12, 7.2); crate(-14, 10); crate(-28, 8); crate(28, -10); crate(26.8, -10);
  crate(-10, -28); crate(20, 28); crate(21.2, 28); crate(21.2, 28, 1.0, 1.2); crate(-30, -8);
  crate(10, -10); crate(-18, -6); crate(30, 30); crate(-4, 20); crate(16, 18);

  [['A', 26, 26], ['B', 22, -30]].forEach(([l, x, z]) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshLambertMaterial({ map: siteTex(l), transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.02, z); scene.add(m);
  });
  const shootWorld = wallMeshes.concat([ground]);

  function isFree(x, z, margin) {
    if (Math.abs(x) > HALF - 1 - margin || Math.abs(z) > HALF - 1 - margin) return false;
    return !colliders.some(c => x > c.minX - margin && x < c.maxX + margin && z > c.minZ - margin && z < c.maxZ + margin);
  }
  const waypoints = [];
  for (let x = -32; x <= 32; x += 4) for (let z = -32; z <= 32; z += 4) if (isFree(x, z, 1)) waypoints.push(V(x, 0, z));

  const PLAYER_SPAWN = V(-30, 0, -30), PLAYER_YAW = -Math.PI / 2;
  const ENEMY_SPAWNS = [[28, 30], [22, 32], [14, 30], [30, 22], [10, 22], [30, -6], [24, -8], [6, 30], [-6, 30],
    [-28, 30], [-30, 12], [20, -30], [32, 32], [-20, 30], [4, 12], [18, -10], [32, -30], [-10, 14]]
    .filter(([x, z]) => isFree(x, z, 0.8)).map(([x, z]) => V(x, 0, z));

  // ================= 碰撞 / 视线 =================
  function collide(p, r, feetY) {
    for (const c of colliders) {
      if (c.top <= feetY + 0.35) continue;
      const cx = clamp(p.x, c.minX, c.maxX), cz = clamp(p.z, c.minZ, c.maxZ);
      const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;
      if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
      else {
        const l = p.x - c.minX, rr = c.maxX - p.x, b = p.z - c.minZ, t = c.maxZ - p.z, m = Math.min(l, rr, b, t);
        if (m === l) p.x = c.minX - r; else if (m === rr) p.x = c.maxX + r; else if (m === b) p.z = c.minZ - r; else p.z = c.maxZ + r;
      }
    }
  }
  function groundAt(p, r, feetY) {
    let g = 0;
    for (const c of colliders) {
      if (c.top > feetY + 0.35) continue;
      if (p.x > c.minX - r * 0.6 && p.x < c.maxX + r * 0.6 && p.z > c.minZ - r * 0.6 && p.z < c.maxZ + r * 0.6) g = Math.max(g, c.top);
    }
    return g;
  }
  const ray = new THREE.Raycaster();
  function clearLine(a, b) {
    const dir = b.clone().sub(a), dist = dir.length();
    ray.set(a, dir.normalize()); ray.far = dist;
    return ray.intersectObjects(wallMeshes, false).length === 0;
  }

  // ================= 音效（WebAudio 合成） =================
  let actx, noise;
  function ac() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        noise = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
        const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { actx = null; }
    }
    return actx;
  }
  function burstNoise(t, dur, freq, vol, type = 'lowpass') {
    const a = actx, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noise; f.type = type; f.frequency.value = freq;
    src.connect(f); f.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.start(t); src.stop(t + dur);
  }
  function tone(t, f0, f1, dur, vol, type = 'square') {
    const a = actx, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  }
  function sfx(type, vol = 1) {
    if (!ac()) return;
    const t = actx.currentTime;
    switch (type) {

    colliders.forEach(c => g.fillRect((c.minX + HALF) * RS, (c.minZ + HALF) * RS, Math.max(1, (c.maxX - c.minX) * RS), Math.max(1, (c.maxZ - c.minZ) * RS)));
    g.fillStyle = 'rgba(220,70,40,.9)'; g.font = 'bold 12px sans-serif';
    g.fillText('A', (26 + HALF) * RS - 4, (26 + HALF) * RS + 4); g.fillText('B', (22 + HALF) * RS - 4, (-30 + HALF) * RS + 4);
  })();
  function drawRadar() {
    rctx.clearRect(0, 0, 150, 150); rctx.drawImage(radarBg, 0, 0);
    rctx.fillStyle = '#ff4433';
    enemies.forEach(e => {
      if (!e.alive || time - e.lastSeen > 2) return;
      rctx.beginPath(); rctx.arc((e.group.position.x + HALF) * RS, (e.group.position.z + HALF) * RS, 3, 0, Math.PI * 2); rctx.fill();
    });
    rctx.save();
    rctx.translate((player.pos.x + HALF) * RS, (player.pos.z + HALF) * RS); rctx.rotate(-player.yaw);
    rctx.fillStyle = '#7fb2ff'; rctx.beginPath(); rctx.moveTo(0, -6); rctx.lineTo(4, 4); rctx.lineTo(-4, 4); rctx.fill();
    rctx.restore();
  }

  // ================= 主循环 =================
  function update(dt) {
    player.crouch = !!(keys.KeyC || keys.ControlLeft || touchCrouch);
    player.eye += ((player.crouch ? 1.15 : 1.6) - player.eye) * Math.min(1, dt * 12);

    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) + touchMove.y;
    const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + touchMove.x;
    let mx = -Math.sin(player.yaw) * f + Math.cos(player.yaw) * s, mz = -Math.cos(player.yaw) * f - Math.sin(player.yaw) * s;
    const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
    const speed = player.crouch ? 2.2 : keys.ShiftLeft || keys.ShiftRight ? 2.6 : 5.4;
    const accel = Math.min(1, dt * (player.onGround ? 12 : 2));
    player.vel.x += (mx * speed - player.vel.x) * accel;
    player.vel.z += (mz * speed - player.vel.z) * accel;
    if (keys.Space && player.onGround) { player.vel.y = 5.5; player.onGround = false; }
    player.vel.y -= 16 * dt;
    const p = player.pos;
    p.x += player.vel.x * dt; p.z += player.vel.z * dt;
    collide(p, 0.38, p.y);
    enemies.forEach(e => {
      if (!e.alive) return;
      const dx = p.x - e.group.position.x, dz = p.z - e.group.position.z, d = Math.hypot(dx, dz);
      if (d < 0.75 && d > 1e-4) { p.x = e.group.position.x + dx / d * 0.75; p.z = e.group.position.z + dz / d * 0.75; }
    });
    p.y += player.vel.y * dt;
    const gy = groundAt(p, 0.38, p.y);
    if (p.y <= gy) { p.y = gy; player.vel.y = 0; player.onGround = true; } else player.onGround = p.y - gy < 0.02;

    gun.cooldown -= dt;
    if (gun.reloading > 0) {
      gun.reloading -= dt;
      if (gun.reloading <= 0) { const take = Math.min(30 - gun.mag, gun.reserve); gun.mag += take; gun.reserve -= take; }
    }
    if (mouseDown) fire();
    if (!mouseDown) gun.spread = Math.max(0, gun.spread - dt * 0.12);
    recoil.pitch -= recoil.pitch * Math.min(1, dt * (mouseDown ? 2.5 : 8));
    recoil.yaw -= recoil.yaw * Math.min(1, dt * 8);
    recoil.kick = Math.max(0, recoil.kick - dt * 14);

    enemies.forEach(e => updateEnemy(e, dt));
    enemies = enemies.filter(e => !e.removed);
    for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
      const a = enemies[i].group.position, b = enemies[j].group.position;
      if (!enemies[i].alive || !enemies[j].alive) continue;
      const dx = a.x - b.x, dz = a.z - b.z, d = Math.hypot(dx, dz);
      if (d < 0.7 && d > 1e-4) { const push = (0.7 - d) / 2; a.x += dx / d * push; a.z += dz / d * push; b.x -= dx / d * push; b.z -= dz / d * push; }
    }

    for (let i = fx.length - 1; i >= 0; i--) {
      const q = fx[i]; q.life -= dt; q.v.y -= 9 * dt; q.m.position.addScaledVector(q.v, dt);
      if (q.life <= 0) { scene.remove(q.m); fx.splice(i, 1); }
    }
    for (let i = tracers.length - 1; i >= 0; i--) {
      tracers[i].life -= dt;
      if (tracers[i].life <= 0) { scene.remove(tracers[i].l); tracers[i].l.geometry.dispose(); tracers.splice(i, 1); }
    }

    if (roundEndT > 0) { roundEndT -= dt; if (roundEndT <= 0 && state === 'play') startRound(round + 1); }

    // 武器晃动 / 后坐 / 换弹动画
    const sp = Math.hypot(player.vel.x, player.vel.z);
    bobT += dt * sp * 1.8;
    const bob = reduceMotion ? 0 : Math.min(1, sp / 5);
    const rl = gun.reloading > 0 ? Math.sin(Math.PI * (1 - gun.reloading / 2)) : 0;
    vm.position.set(VM_BASE.x + Math.sin(bobT) * 0.012 * bob, VM_BASE.y - Math.abs(Math.cos(bobT)) * 0.012 * bob - rl * 0.12 + (player.crouch ? 0.01 : 0), VM_BASE.z + recoil.kick * 0.035);
    vm.rotation.set(recoil.kick * 0.05 - rl * 0.5, 0, rl * 0.4);

    updateHud(); drawRadar();
  }

  function render() {
    syncCamera();
    renderer.clear(); renderer.render(scene, camera);
    if (state === 'play' || state === 'paused') { renderer.clearDepth(); renderer.render(vmScene, vmCamera); }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') { time += dt; update(dt); }
    else if (state === 'menu') { player.yaw += dt * 0.08; player.pos.set(-4, 0, -12); player.pitch = -0.05; }
    render();
    requestAnimationFrame(frame);
  }

  // ================= 菜单 / 暂停 / 结算 =================
  const overlay = $('overlay'), panel = $('panel');
  function showPanel(html, btnText, onClick) {
    panel.innerHTML = html + `<button id="go">${btnText}</button>`;
    $('go').addEventListener('click', e => { e.stopPropagation(); ac(); onClick(); });
    overlay.hidden = false;
  }
  function controlsHtml() {
    return isTouch
      ? `<div class="keys"><kbd>左侧拖动</kbd><span>移动</span><kbd>右侧滑动</kbd><span>瞄准</span><kbd>开火键</kbd><span>按住连发，按住时也能滑动瞄准</span><kbd>换弹 / 跳 / 蹲</kbd><span>右侧按钮</span></div>`
      : `<div class="keys"><kbd>W A S D</kbd><span>移动</span><kbd>鼠标</kbd><span>瞄准，左键开火（按住连发）</span><kbd>R</kbd><span>换弹</span><kbd>空格</kbd><span>跳跃，可以跳上木箱</span><kbd>C</kbd><span>蹲下，移动变慢但更准</span><kbd>Shift</kbd><span>静步</span><kbd>Esc</kbd><span>暂停</span></div>`;
  }
  function showMenu() {
    const b = best();
    showPanel(`<h1>沙城突击</h1><p class="tag">Counter-Strike 风格 · 第一人称</p>
      <p>你是一名反恐精英，从西南角的 CT 出生点出发，在沙城地图里清除所有恐怖分子。每回合敌人更多、反应更快、枪法更准。爆头一枪毙命。</p>
      ${controlsHtml()}`, '开始游戏', newGame);
    panel.insertAdjacentHTML('beforeend', `<p class="best">${b.score ? `最高纪录：第 ${b.round} 回合 · ${b.score} 分` : '还没有纪录，打一局试试'}</p>`);
  }
  function resume() {
    overlay.hidden = true; $('hud').hidden = false; $('touch').hidden = !isTouch;
    state = 'play'; last = performance.now();
    if (!isTouch && !noLock) {
      try {
        const r = canvasEl.requestPointerLock();
        lockViaPromise = !!(r && r.catch);
        if (lockViaPromise) r.catch(lockFailed);
      } catch (e) { noLock = true; }
    }
  }
  function pause() {
    if (state !== 'play') return;
    state = 'paused'; mouseDown = false;
    for (const k in keys) keys[k] = false;
    showPanel(`<h1>已暂停</h1><p>第 ${round} 回合 · 得分 ${score}</p>`, '继续游戏', resume);
  }
  function gameOver() {
    state = 'over'; mouseDown = false;
    if (document.pointerLockElement) document.exitPointerLock();
    sfx('lose');
    const b = best(), isNew = score > b.score;
    if (isNew) saveBest({ score, round });
    const acc = shots ? Math.round(hits / shots * 100) : 0;
    $('hud').hidden = true; $('touch').hidden = true;
    showPanel(`<h1>${isNew ? '新纪录' : '你阵亡了'}</h1><p class="tag">恐怖分子获胜</p>
      <div class="stats"><div><span>坚持到</span><b>第 ${round} 回合</b></div><div><span>得分</span><b>${score}</b></div>
      <div><span>击杀</span><b>${kills}</b></div><div><span>爆头</span><b>${headshots}</b></div><div><span>命中率</span><b>${acc}%</b></div></div>`,
      '再来一局', newGame);
    panel.insertAdjacentHTML('beforeend', `<p class="best">最高纪录：第 ${Math.max(b.round, isNew ? round : 0)} 回合 · ${Math.max(b.score, score)} 分</p>`);
  }

  // ================= 输入 =================
  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === canvasEl;
    if (!locked && state === 'play' && !noLock) pause();
  });
  // 刚按 Esc 后浏览器会短暂拒绝再次锁定：第一次失败先回到暂停让玩家重试，再失败就改用不锁定鼠标的模式
  let lockFails = 0, lockViaPromise = false;
  function lockFailed() {
    if (++lockFails >= 2) noLock = true;
    else pause();
  }
  document.addEventListener('pointerlockerror', () => { if (!lockViaPromise) lockFailed(); });
  document.addEventListener('pointerlockchange', () => { if (document.pointerLockElement) lockFails = 0; });
  document.addEventListener('mousemove', e => {
    if (state !== 'play' || isTouch || (!locked && !noLock)) return;
    player.yaw -= e.movementX * 0.0022;
    player.pitch = clamp(player.pitch - e.movementY * 0.0022, -1.45, 1.45);
  });
  canvasEl.addEventListener('mousedown', e => {
    if (state !== 'play') return;
    if (!locked && !noLock) { resume(); return; }
    if (e.button === 0) mouseDown = true;
  });
  window.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
  canvasEl.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (state === 'play' && ['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyC'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'KeyR' && state === 'play') startReload();
    if (e.code === 'Escape' && noLock) pause();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // 触屏：左侧虚拟摇杆，右侧滑动视角
  let stickId = null, lookId = null, stickO = null, lookLast = null;
  const stick = $('stick'), knob = $('knob');
  const look = (dx, dy) => { player.yaw -= dx * 0.006; player.pitch = clamp(player.pitch - dy * 0.006, -1.45, 1.45); };
  canvasEl.addEventListener('touchstart', e => {
    e.preventDefault(); if (state !== 'play') return;
    for (const t of e.changedTouches) {
      if (t.clientX < window.innerWidth * 0.45 && stickId === null) {
        stickId = t.identifier; stickO = { x: t.clientX, y: t.clientY };
        stick.style.left = t.clientX + 'px'; stick.style.top = t.clientY + 'px'; stick.hidden = false;
      } else if (lookId === null) { lookId = t.identifier; lookLast = { x: t.clientX, y: t.clientY }; }
    }
  }, { passive: false });
  canvasEl.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        let dx = t.clientX - stickO.x, dy = t.clientY - stickO.y; const d = Math.hypot(dx, dy);
        if (d > 45) { dx = dx / d * 45; dy = dy / d * 45; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        touchMove.x = dx / 45; touchMove.y = -dy / 45;
      } else if (t.identifier === lookId) { look(t.clientX - lookLast.x, t.clientY - lookLast.y); lookLast = { x: t.clientX, y: t.clientY }; }
    }
  }, { passive: false });
  const touchEnd = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) { stickId = null; touchMove.x = touchMove.y = 0; stick.hidden = true; knob.style.transform = ''; }
      if (t.identifier === lookId) lookId = null;
    }
  };
  canvasEl.addEventListener('touchend', touchEnd); canvasEl.addEventListener('touchcancel', touchEnd);
  let fireLast = null;
  const tFire = $('tFire');
  tFire.addEventListener('touchstart', e => { e.preventDefault(); mouseDown = true; fireLast = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: false });
  tFire.addEventListener('touchmove', e => {
    e.preventDefault(); const t = e.targetTouches[0]; if (!t || !fireLast) return;
    look(t.clientX - fireLast.x, t.clientY - fireLast.y); fireLast = { x: t.clientX, y: t.clientY };
  }, { passive: false });
  tFire.addEventListener('touchend', () => { mouseDown = false; fireLast = null; });
  $('tReload').addEventListener('touchstart', e => { e.preventDefault(); startReload(); }, { passive: false });
  $('tJump').addEventListener('touchstart', e => { e.preventDefault(); keys.Space = true; setTimeout(() => keys.Space = false, 120); }, { passive: false });
  $('tCrouch').addEventListener('touchstart', e => { e.preventDefault(); touchCrouch = !touchCrouch; $('tCrouch').style.background = touchCrouch ? 'rgba(242,212,138,.45)' : ''; }, { passive: false });

  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
